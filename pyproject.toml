[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "semanticvideo"
version = "0.1.0"
description = "Open semantic video format and AI-native video understanding SDK"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
  { name = "SemanticVideo contributors" },
]
keywords = ["video", "metadata", "semantic-video", "ai", "editing"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "pillow>=12",
  "pydantic>=2.11,<3",
]

[project.optional-dependencies]
openai = [
  "openai>=1.0",
]

[project.urls]
Homepage = "https://github.com/TristinOrg/SemanticVideo"
Documentation = "https://github.com/TristinOrg/SemanticVideo/tree/main/docs"
Issues = "https://github.com/TristinOrg/SemanticVideo/issues"
Repository = "https://github.com/TristinOrg/SemanticVideo.git"

[project.scripts]
semanticvideo = "semanticvideo.cli.main:main"
semanticvideo-schema = "semanticvideo.schema.export:main"

[dependency-groups]
dev = [
  "mypy>=1.17",
  "pytest>=8.4",
  "pytest-cov>=6.2",
  "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/semanticvideo"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=semanticvideo --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
markers = [
  "integration: requires ffmpeg and ffprobe executables",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.coverage.run]
branch = true
source = ["semanticvideo"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
