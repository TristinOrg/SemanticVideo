name: Bug report
description: Report incorrect behavior or schema validation.
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the smallest manifest or code sample that reproduces it.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SemanticVideo version
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, and relevant dependencies.

